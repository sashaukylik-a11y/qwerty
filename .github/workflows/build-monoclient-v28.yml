name: Build MonoClient v28 hotfix

on:
  push:
    branches:
      - fix/v28-rshift-menu
    paths:
      - "monoclient-v28/**"
      - ".github/workflows/build-monoclient-v28.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: monoclient-v28
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: cmd
        run: reconstruct-source.cmd

      - name: Verify reconstructed source hash
        shell: powershell
        run: |
          $expected = (Get-Content .\SOURCE_SHA256-v28.txt).Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash .\MonoClient.cpp -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source SHA mismatch: $actual != $expected" }

      - name: Build x64 EXE
        shell: cmd
        run: build.cmd

      - name: Audit embedded manifest and PE
        shell: powershell
        run: |
          $bytes = [IO.File]::ReadAllBytes(".\MonoClient-Full-v28.exe")
          if ($bytes.Length -lt 4096) { throw "EXE unexpectedly small" }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Missing MZ header" }
          $ascii = [Text.Encoding]::UTF8.GetString($bytes)
          if (-not $ascii.Contains("requireAdministrator")) { throw "UAC manifest was not embedded" }

      - name: Smoke launch
        shell: powershell
        run: |
          $p = Start-Process -FilePath ".\MonoClient-Full-v28.exe" -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited) { throw "MonoClient exited during startup. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Wait-Process -Id $p.Id -ErrorAction SilentlyContinue

      - name: Right Shift regression test
        shell: powershell
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Win32 {
            [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern IntPtr FindWindow(string lpClassName, string lpWindowName);
            [DllImport("user32.dll")]
            public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll")]
            public static extern void keybd_event(byte bVk, byte bScan, uint dwFlags, UIntPtr dwExtraInfo);
            [DllImport("user32.dll", SetLastError=true)]
            public static extern bool GetLayeredWindowAttributes(IntPtr hwnd, out uint crKey, out byte bAlpha, out uint dwFlags);
          }
          "@
          function Press-RShift {
            [Win32]::keybd_event(0xA1, 0, 0, [UIntPtr]::Zero)
            Start-Sleep -Milliseconds 70
            [Win32]::keybd_event(0xA1, 0, 2, [UIntPtr]::Zero)
          }
          $p = Start-Process -FilePath ".\MonoClient-Full-v28.exe" -PassThru
          try {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { throw "MonoClient exited before hotkey test. ExitCode=$($p.ExitCode)" }
            $h = [Win32]::FindWindow("MonoClient.Main", $null)
            if ($h -eq [IntPtr]::Zero) { throw "MonoClient.Main window was not created" }
            if ([Win32]::IsWindowVisible($h)) { throw "Menu should start hidden" }

            Press-RShift
            Start-Sleep -Milliseconds 700
            if (-not [Win32]::IsWindowVisible($h)) { throw "FIRST Right Shift did not open menu" }
            $key=[uint32]0; $alpha=[byte]0; $flags=[uint32]0
            [void][Win32]::GetLayeredWindowAttributes($h, [ref]$key, [ref]$alpha, [ref]$flags)
            if ($alpha -lt 200) { throw "Menu opened with unexpectedly low alpha: $alpha" }

            Press-RShift
            Start-Sleep -Milliseconds 700
            if ([Win32]::IsWindowVisible($h)) { throw "Second Right Shift did not close menu" }

            Press-RShift
            Start-Sleep -Milliseconds 700
            if (-not [Win32]::IsWindowVisible($h)) { throw "Third Right Shift did not reopen menu" }
          }
          finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Wait-Process -Id $p.Id -ErrorAction SilentlyContinue
          }

      - name: Reproducibility check
        shell: powershell
        run: |
          Copy-Item .\MonoClient-Full-v28.exe .\build-first.exe
          cmd /c build.cmd
          $h1 = (Get-FileHash .\build-first.exe -Algorithm SHA256).Hash
          $h2 = (Get-FileHash .\MonoClient-Full-v28.exe -Algorithm SHA256).Hash
          if ($h1 -ne $h2) { throw "Non-reproducible build: $h1 != $h2" }
          Write-Host "SHA256 $h2"

      - name: Upload audited EXE
        uses: actions/upload-artifact@v4
        with:
          name: MonoClient-Full-v28-AUDITED
          path: monoclient-v28/MonoClient-Full-v28.exe
          if-no-files-found: error
